<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="assets/css/card.css">
</head>

<body class="page">

    <main class="page__stage">
        <article class="product-card">

            <div class="product-card__visual">
                <button
                    class="product-card__favorite"
                    type="button"
                    aria-label="Add to favorites"
                ><img 
                    src="assets/images/heart.png" 
                    alt=""
                >
            
            </button>

                <span class="product-card__badge">
                    SPECIAL OFFER
                </span>

                <img
                    class="product-card__image"
                    src="assets/images/shoe.png"
                    alt="Red Nike running shoe"
                >
            </div>

            <div class="product-card__details">
                <p class="product-card__category">
                    Men's sports shoes
                </p>

                <h1 class="product-card__title">
                    Nike Men's Ergonomic Running Shoes
                </h1>

                <div class="product-card__rating">
                    <span class="product-card__rating-count">
                        (324)
                    </span>
                    <span class="product-card__rating-value">
                        4.8
                    </span>
                    <span class="product-card__star"> 
                        <img src="assets/images/star.png" alt="">
                    </span>
                </div>

                <div class="product-card__prices">
                    <span class="product-card__price">
                        €120.00
                    </span>
                    <span class="product-card__price product-card__price--old">
                        €150.00
                    </span>
                </div>

                <div class="product-card__colors">
                    <button
                        class="product-card__color product-card__color--black"
                        type="button"
                        aria-label="Black"
                    ></button>

                    <button
                        class="product-card__color product-card__color--blue"
                        type="button"
                        aria-label="Blue"
                    ></button>

                    <button
                        class="product-card__color product-card__color--red"
                        type="button"
                        aria-label="Red"
                    ></button>
                </div>

                <button
                    class="product-card__button"
                    type="button"
                >
                    Add to cart
                </button>
            </div>

        </article>
    </main>

</body>
</html>
